version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: muhsin_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-muhsin_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-muhsin_secure_password_123}
      POSTGRES_DB: ${DB_NAME:-muhsin_db}
    # No ports exposed to internet: completely private inside Docker network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-muhsin_admin} -d ${DB_NAME:-muhsin_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: muhsin_redis
    restart: unless-stopped
    # No ports exposed to internet: completely private inside Docker network
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: muhsin_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${DB_USER:-muhsin_admin}:${DB_PASSWORD:-muhsin_secure_password_123}@postgres:5432/${DB_NAME:-muhsin_db}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-production-secret-min-32-chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-production-refresh-secret-min-32-chars}
      ACCESS_TOKEN_TTL: 900
      REFRESH_TOKEN_TTL: 604800
      PORT: 3001
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@muhsin.id}
    # Only bind to host localhost (reverse-proxied by Nginx/Caddy on VPS)
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.muhsin.id}
        VITE_DEFAULT_SCHOOL_SLUG: ${VITE_DEFAULT_SCHOOL_SLUG:-alfitrah}
    container_name: muhsin_web
    restart: unless-stopped
    # Only bind to host localhost (reverse-proxied by Nginx/Caddy on VPS)
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
